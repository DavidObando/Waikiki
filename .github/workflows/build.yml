name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build Waikiki.slnx -c Release

      - name: Test
        run: dotnet test Waikiki.slnx -c Release --no-build

  package:
    name: Package ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.runner }}
    env:
      # True when the signing certificate secret is available (not on fork PRs).
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macOS-arm64, runner: macos-latest,   rid: osx-arm64,   kind: macos }
          - { label: macOS-x64,   runner: macos-latest,   rid: osx-x64,     kind: macos }
          - { label: Windows-x64, runner: windows-latest, rid: win-x64,     kind: windows }
          - { label: Windows-arm64, runner: windows-latest, rid: win-arm64, kind: windows }
          - { label: Linux-x64,   runner: ubuntu-latest,  rid: linux-x64,   kind: linux }
          - { label: Linux-arm64, runner: ubuntu-latest,  rid: linux-arm64, kind: linux }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Import code signing certificate
        if: matrix.kind == 'macos' && env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE="$(mktemp "$RUNNER_TEMP/cert.XXXXXX.p12")"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_FILE"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in the imported certificate." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Found signing identity: $IDENTITY"

      - name: Package (macOS)
        if: matrix.kind == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--runtime "${{ matrix.rid }}" --output ./artifacts)
          if [[ -n "${CODESIGN_IDENTITY:-}" ]]; then
            args+=(--codesign-identity "$CODESIGN_IDENTITY")
          fi
          # Notarize everything except pull requests, and only when all the Apple credentials exist.
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && -n "${CODESIGN_IDENTITY:-}" \
                && -n "${APPLE_ID:-}" && -n "${APPLE_ID_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            args+=(--notarize)
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
          fi
          ./build/build-macos.sh "${args[@]}"

      - name: Verify notarization
        if: matrix.kind == 'macos' && env.NOTARIZED == 'true'
        run: |
          for dmg in ./artifacts/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vv "$dmg"
          done

      - name: Remove signing keychain
        if: always() && matrix.kind == 'macos'
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Package (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./build/build-windows.ps1 -Runtime ${{ matrix.rid }} -OutputDir ./artifacts

      - name: Package (Linux)
        if: matrix.kind == 'linux'
        run: ./build/build-linux.sh --runtime ${{ matrix.rid }} --output ./artifacts

      # Run the packaged app's non-UI startup path, but only where the runner can execute the build.
      - name: Smoke test (macOS arm64)
        if: matrix.rid == 'osx-arm64'
        run: ./artifacts/Waikiki.app/Contents/MacOS/Waikiki --smoke-test

      - name: Smoke test (Windows x64)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem ./artifacts/*.zip).FullName -DestinationPath ./smoke
          ./smoke/Waikiki.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }

      - name: Smoke test (Linux x64)
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir smoke && tar -xzf ./artifacts/*.tar.gz -C smoke
          app_dir=$(echo smoke/Waikiki-*)
          "./$app_dir/Waikiki" --smoke-test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Waikiki-${{ matrix.label }}
          path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
